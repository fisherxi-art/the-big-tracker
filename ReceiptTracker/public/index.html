<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Receipt Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 data-i18n="title">Home Finance</h1>
        <button id="lang-toggle">繁 / EN</button>
    </header>

    <main class="container">
        <section class="card upload-section">
            <label for="receipt-upload" class="upload-btn">
                <span class="icon">📷</span>
                <span data-i18n="upload_btn">Snap / Upload Receipt(s)</span>
            </label>
            <input type="file" id="receipt-upload" accept="image/*" capture="environment" multiple style="display: none;">
            <div id="loading" class="hidden" data-i18n="analyzing">Analyzing…</div>
        </section>

        <div id="receipt-jobs"></div>

        <section id="weekly-chart-section" class="card weekly-chart-card">
            <h2 data-i18n="weekly_chart_title">Weekly spending (Thu–Wed)</h2>
            <p class="weekly-chart-legend" id="weekly-chart-legend"></p>
            <div id="weekly-chart" class="weekly-chart-host"></div>
        </section>

        <section id="storage-section" class="card storage-card">
            <h2 data-i18n="storage_title">Storage</h2>
            <p id="storage-summary" class="storage-summary"></p>
            <div class="storage-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100">
                <div id="storage-bar-fill" class="storage-bar-fill"></div>
            </div>
            <button type="button" id="prune-receipt-photos" class="btn btn-secondary storage-prune-btn" data-i18n="prune_photos_btn">Delete photos older than 6 months</button>
        </section>

        <section id="stats-section" class="card">
            <h2 data-i18n="stats_title">This Month</h2>
            <ul id="stats-list" class="stats-list"></ul>
            <div id="category-items-panel" class="category-items-panel hidden" aria-live="polite">
                <h4 id="category-items-heading" class="category-items-heading"></h4>
                <ul id="category-items-list" class="category-items-list"></ul>
            </div>

            <h3 data-i18n="records_title">All records</h3>
            <ul id="recent-list" class="recent-list records-list"></ul>
            <button type="button" id="load-more-records" class="btn btn-secondary load-more-records hidden" data-i18n="load_more_records">Load more</button>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
